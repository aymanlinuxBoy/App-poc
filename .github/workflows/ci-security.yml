---
name: CI Security Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "k8s/overlays/poc/kustomization.yaml"
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  IMAGE_NAME: devsecops-demo

jobs:
  lint-and-security:
    name: Lint and security scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Run yamllint
        run: |
          yamllint -c .yamllint.yaml .

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
           GITHUB_TOKEN: ${{ secrets.TOKEN}}

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true
          soft_fail: true

  build-scan-push:
    name: Build, scan, push and update GitOps
    runs-on: ubuntu-latest
    needs: lint-and-security

    # Do not build/push images for pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate image tag
        id: vars
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Display image tag
        run: |
          echo "New image tag: ${{ steps.vars.outputs.tag }}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ steps.vars.outputs.tag }}" \
            .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: >-
            ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-demo:${{ steps.vars.outputs.tag }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

      - name: Push Docker image
        run: |
          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ steps.vars.outputs.tag }}"

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Update Kustomize image tag
        run: |
          yq -i \
            '.images[0].newTag = "${{ steps.vars.outputs.tag }}"' \
            k8s/overlays/poc/kustomization.yaml

      - name: Show updated Kustomize file
        run: |
          cat k8s/overlays/poc/kustomization.yaml

      - name: Validate Kustomize rendering
        run: |
          kubectl kustomize k8s/overlays/poc

      - name: Commit GitOps update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/overlays/poc/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "chore: update devsecops-demo image to ${{ steps.vars.outputs.tag }}"

          git push
