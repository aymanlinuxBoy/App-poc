---
name: CI Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: devsecops-demo

jobs:
  lint-and-security:
    name: Lint and security scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------
      # Dockerfile linting
      # ---------------------------------------------------
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      # ---------------------------------------------------
      # YAML linting
      # ---------------------------------------------------
      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Run yamllint
        run: |
          yamllint -c .yamllint.yaml .

      # ---------------------------------------------------
      # Secret scanning
      # ---------------------------------------------------
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2

      # ---------------------------------------------------
      # Infrastructure / Kubernetes security scanning
      # ---------------------------------------------------
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true
          soft_fail: false

  build-scan-push:
    name: Build, scan and push image
    runs-on: ubuntu-latest
    needs: lint-and-security

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # Generate image tag from Git commit SHA
      # ---------------------------------------------------
      - name: Set image tag
        id: vars
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------
      # Docker Hub authentication
      # ---------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------------------------------------------
      # Build container image
      # ---------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ steps.vars.outputs.tag }}" \
            .

      # ---------------------------------------------------
      # Container vulnerability scanning
      # ---------------------------------------------------
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: >-
            ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-demo:${{ steps.vars.outputs.tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

      # ---------------------------------------------------
      # Push image only after Trivy succeeds
      # ---------------------------------------------------
      - name: Push Docker image
        run: |
          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ steps.vars.outputs.tag }}"
