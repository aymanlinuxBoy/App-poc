---
name: CI Security Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "k8s/overlays/poc/kustomization.yaml"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "k8s/overlays/poc/kustomization.yaml"

permissions:
  contents: write

env:
  IMAGE_NAME: devsecops-demo
  KUSTOMIZE_FILE: k8s/overlays/poc/kustomization.yaml
  ARGOCD_APP: devsecops-demo

jobs:
  lint-and-security:
    name: Lint and security scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Run yamllint
        run: |
          yamllint -c .yamllint.yaml .

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true
          soft_fail: true

  build-scan-push:
    name: Build, scan, push and verify
    runs-on: ubuntu-latest
    needs: lint-and-security

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate image tag
        id: vars
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Show generated image tag
        run: |
          echo "Image tag: ${{ steps.vars.outputs.tag }}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ steps.vars.outputs.tag }}" \
            .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: >-
            ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-demo:${{ steps.vars.outputs.tag }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

      - name: Push Docker image
        run: |
          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ steps.vars.outputs.tag }}"

      - name: Update Kustomize image tag
        uses: mikefarah/yq@v4
        with:
          cmd: >-
            yq -i
            '.images[0].newTag = "${{ steps.vars.outputs.tag }}"'
            k8s/overlays/poc/kustomization.yaml

      - name: Show updated Kustomize file
        run: |
          cat "$KUSTOMIZE_FILE"

      - name: Validate Kustomize rendering
        run: |
          kubectl kustomize k8s/overlays/poc

      - name: Commit GitOps update
        id: gitops_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$KUSTOMIZE_FILE"

          if git diff --cached --quiet; then
            echo "No Kustomize changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit \
            -m "chore: update image to ${{ steps.vars.outputs.tag }} [skip ci]"

          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          git push origin main

      - name: Install ArgoCD CLI
        run: |
          curl -sSL \
            -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64

          chmod +x /usr/local/bin/argocd

          argocd version --client

      - name: Verify ArgoCD deployment
        id: verify
        if: steps.gitops_commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          echo "Waiting for ArgoCD application to become Synced and Healthy..."

          argocd app wait "$ARGOCD_APP" \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --grpc-web \
            --sync \
            --health \
            --timeout 300

      - name: Deployment successful
        if: steps.verify.outcome == 'success'
        run: |
          echo "Deployment completed successfully."
          echo "Application: $ARGOCD_APP"
          echo "Image tag: ${{ steps.vars.outputs.tag }}"

      - name: Rollback failed deployment
        if: steps.verify.outcome == 'failure'
        run: |
          echo "Deployment verification failed."
          echo "Reverting GitOps image-tag commit..."

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin main

          git revert \
            --no-edit \
            "${{ steps.gitops_commit.outputs.commit }}"

          git push origin main

          echo "Rollback commit pushed."

      - name: Verify rollback
        if: steps.verify.outcome == 'failure'
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          echo "Waiting for ArgoCD rollback..."

          argocd app wait "$ARGOCD_APP" \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --grpc-web \
            --sync \
            --health \
            --timeout 300

      - name: Fail pipeline after rollback
        if: steps.verify.outcome == 'failure'
        run: |
          echo "New deployment failed."
          echo "Rollback completed."
          exit 1
