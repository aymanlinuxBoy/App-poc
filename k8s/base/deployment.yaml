---
apiVersion: apps/v1
kind: Rollout
metadata:
  name: devsecops-demo

spec:
  #replicas: 3

  selector:
    matchLabels:
      app: devsecops-demo

  template:
    metadata:
      labels:
        app: devsecops-demo

    spec:
      containers:
        - name: devsecops-demo
          image: aimocont2020/devsecops-demo

          ports:
            - containerPort: 8080


              strategy:
    canary:
      steps:
        - setWeight: 10
        - pause: {}

        - setWeight: 50
        - pause: {}

        - setWeight: 100
