---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: devsecops-prometheus-test

spec:
  metrics:
    - name: prometheus-up
      interval: 10s
      count: 3

      successCondition: result[0] > 0
      failureLimit: 1

      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090

          query: |
            sum(up)