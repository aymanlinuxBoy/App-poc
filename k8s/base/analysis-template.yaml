---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: devsecops-success-rate

spec:
  metrics:
    - name: success-rate
      interval: 30s
      count: 3

      successCondition: result[0] >= 0.95
      failureLimit: 2

      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local

          query: |
            sum(
              rate(
                http_requests_total{
                  status!~"5.."
                }[1m]
              )
            )
            /
            sum(
              rate(
                http_requests_total[1m]
              )
            )
