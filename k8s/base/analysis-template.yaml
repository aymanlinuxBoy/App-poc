---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: devsecops-success-rate

spec:
  metrics:
    - name: success-rate
      interval: 30s
      count: 3

      successCondition: result[0] >= 0.95
      failureLimit: 2

      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090

          query: |
            sum(up)
