---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: devsecops-demo

  template:
    metadata:
      labels:
        app: devsecops-demo

    spec:
      containers:
        - name: devsecops-demo
          image: DOCKERHUB_USERNAME/devsecops-demo:6ab85ad7948d

          ports:
            - containerPort: 80
